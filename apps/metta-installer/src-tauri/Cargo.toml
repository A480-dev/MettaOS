[package]
name = "metta_installer"
version = "2.0.0"
description = "METTA OS Installer"
edition = "2021"

[lib]
name = "metta_installer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "metta-installer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
